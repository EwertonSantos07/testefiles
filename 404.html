        <!-- Dominio - ROTEADOR -->
        <script>

            // Definindo Raiz do Diretório
            const currentEnvironment = sessionStorage.getItem("proEnvironment")
            const currentLocal = sessionStorage.getItem("localEnvironment")
            const intproEnvironment = parseInt(currentEnvironment)
            const intcurLocal = parseInt(currentLocal)
            let baseURL = null;
            if (intproEnvironment === -1) {
                // Pega o caminho da pasta atual dinamicamente
                baseURL = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            } else if (intproEnvironment === 0) {
                baseURL = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
            } else if (intproEnvironment === 1) {

                //Verificando se é ambiente de teste ou produção definitiva
                if (intcurLocal === 0) {
                    baseURL = "/testefiles/";
                } else if (intcurLocal === 1) {
                    baseURL = "/soft-coding/"
                }
            }

            // Montando Base URL do Diretório
            let baseTag = document.createElement('base');
            baseTag.href = baseURL; 
            document.head.prepend(baseTag);
            sessionStorage.setItem("pathDomain", baseURL);
            
            // Montando Domínio
            sessionStorage.setItem("currentDomain", `${window.location.origin}${baseURL}`)
        </script>

        <!-- Check ADM Session: Se True monitoring GA4/GTM OFF || Se False monitoring GA4/GTM on -->
        <script>
            const COOKIE_NAME = "GA_EXCLUDE_ADM";
            const cookies = document.cookie.split('; ');
            const cookieADM = cookies.find(row => row.startsWith(`${COOKIE_NAME}=`));

            // 1. INTERCEPTADOR: Ativação via URL
            if (window.location.hash === "#adm") {
                const expiraEm = Date.now() + (365 * 24 * 60 * 60 * 1000); // 1 ano em ms
                document.cookie = `${COOKIE_NAME}=${expiraEm}; max-age=31536000; path=/`;
                
                console.log("🛠️ MODO ADM ATIVADO: Cookie gerado.");
                history.replaceState(null, null, window.location.pathname);
                location.reload(); // Recarrega para aplicar a lógica
            }

            // 2. A CHAVE MESTRA: Verificação e Alerta
            if (cookieADM) {
                const dataExpira = parseInt(cookieADM.split('=')[1]);
                const diasRestantes = Math.ceil((dataExpira - Date.now()) / (1000 * 60 * 60 * 24));

                sessionStorage.setItem("ADMstatus", "true");
                console.log(`%c🙈 AMBIENTE ADM: GTM suspenso. Expira em ${diasRestantes} dias.`, "color: #A3FF12;");

                // Alerta visual após o carregamento
                setTimeout(() => {
                    alert(`⚠️ MODO ADM ATIVO!\nMonitoramento GTM bloqueado.\nExpiração: ${diasRestantes} dias restantes.`);
                }, 2300);
            } else {
                console.log("👁️ MODO USUÁRIO: Monitoramento GTM ativo.");
        
                //Google Tag Manager - GTM - The Brain;
                (function(w,d,s,l,i){
                    w[l]=w[l]||[];
                    w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
                    var f=d.getElementsByTagName(s)[0],
                        j=d.createElement(s),
                        dl=l!='dataLayer'?'&l='+l:'';
                    j.async=true;
                    j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
                    f.parentNode.insertBefore(j,f);
                })(window,document,'script','dataLayer','GTM-P9ZNHVHV');
            }
        </script>
